name: release

# Builds and pushes ghcr.io/p7y-dev/foxglove:<version>-dind and :<version>-sysbox.
# Runs on a v* tag push. Can also be started by hand for an existing tag
# (e.g. one created before this workflow existed): the workflow definition
# comes from the branch it is started on, the image is built from the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.6.0"
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/p7y-dev/foxglove

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      - name: Check tag matches VERSION
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          tag="${{ steps.tag.outputs.tag }}"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match VERSION file ($version); expected v$version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dind
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dind
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}-dind
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.version.outputs.revision }}

      - name: Build and push sysbox
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sysbox
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}-sysbox
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.version.outputs.revision }}
