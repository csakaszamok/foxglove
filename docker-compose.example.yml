services:
  foxglove:
    image: ghcr.io/p7y-dev/foxglove:0.7.0-sysbox  # use :0.7.0-dind on Windows or without Sysbox — see README
    runtime: sysbox-runc                  # remove this line and add privileged: true for the dind variant
    environment:
      FRP_SERVER_ADDR: frp.example.com
      FRP_SERVER_PORT: "7000"
      FRP_TOKEN: your-secret-token
      BASE_DOMAIN: example.com
    volumes:
      - ./instance-name:/etc/instance/name:ro
      - foxglove-data:/var/lib/docker

volumes:
  foxglove-data:
